[package]
name = "signers-python"
version.workspace = true
edition = "2024"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
signers = { path = "..", features = ["blocking"] }
pyo3 = { version = "0.29", features = ["abi3-py311"] }
plist = "1.10"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pyo3-log = "0.13"
log = "0.4"
tracing = { version = "0.1", features = ["log"] }

[dev-dependencies]
signers = { path = "..", features = ["blocking", "__test-constructors"] }
