[package]
name = "signers-python"
version.workspace = true
edition = "2024"
publish = false
description = "Python bindings of signers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fly-elf/signers"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
signers = { path = "..", features = ["blocking"] }
pyo3 = { version = "0.29", features = ["abi3-py311"] }
plist = "1.10"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pyo3-log = "0.13"
log = "0.4"
# Unused in code: enables `log`, so the crate's events reach pyo3-log.
tracing = { version = "0.1", features = ["log"] }

[dev-dependencies]
signers = { path = "..", features = ["blocking", "__test-constructors"] }

[package.metadata.cargo-machete]
ignored = ["tracing"]
