[workspace]
members = ["python"]

[workspace.package]
version = "0.1.0"

[package]
name = "signers"
version.workspace = true
edition = "2024"
description = "Ergonomic Rust API for macOS code signing via codesign or apple-codesign"
repository = "https://github.com/Fly-elf/signers.git"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["macos", "codesign", "code-signing", "apple-codesign"]
categories = ["os::macos-apis", "development-tools"]

[dependencies]
base64 = "0.23"
bitflags = "2.13"
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
plist = "1.10"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["process", "fs"], optional = true }
tracing = { version = "0.1", features = ["release_max_level_info"] }

[features]
default = ["async"]
async = ["dep:tokio", "dep:futures-util"]
blocking = ["async", "tokio/rt"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
signers = { path = ".", features = ["blocking"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

# Opt-in test groups: tests needing an environment `cargo test` cannot assume
# are ignored unless their group is set, e.g.
# RUSTFLAGS='--cfg signers_test="keychain"' cargo test
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(signers_test, values("keychain", "network"))'] }
