[package]
name = "signers"
version = "0.1.0"
edition = "2024"
description = "Ergonomic Rust API for macOS code signing via codesign or apple-codesign"
repository = "https://github.com/Fly-elf/signers.git"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["macos", "codesign", "code-signing", "apple-codesign"]
categories = ["os::macos-apis", "development-tools"]

[dependencies]
thiserror = "2.0"
tokio = { version = "1.53", features = ["process", "fs"] }
tracing = "0.1"
