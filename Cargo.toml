[workspace]
members = ["python"]

[workspace.package]
version = "0.1.0"

[package]
name = "signers"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "Hard-to-misuse Rust API over code signing tools, starting with macOS codesign"
repository = "https://github.com/Fly-elf/signers.git"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["codesign", "code-signing", "macos", "signing", "apple"]
categories = ["os::macos-apis", "development-tools"]
include = ["/src/**", "/README.md", "/LICENSE-*", "/CHANGELOG.md"]

[dependencies]
base64 = "0.23"
bitflags = "2.13"
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
plist = "1.10"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["process", "fs"], optional = true }
tracing = "0.1"

[features]
default = ["async"]
async = ["dep:tokio", "dep:futures-util"]
blocking = ["async", "tokio/rt"]
# Internal: builds errors for the tests of crates in this repository. Not part of the public API,
# no semver guarantee.
__test-constructors = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[dev-dependencies]
anyhow = "1.0.104"
signers = { path = ".", features = ["blocking"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[[example]]
name = "codesign_resign_patched"
path = "examples/rust/codesign/resign_patched.rs"

[[example]]
name = "codesign_inspect"
path = "examples/rust/codesign/inspect.rs"

[[example]]
name = "codesign_sign_bundle"
path = "examples/rust/codesign/sign_bundle.rs"

[[example]]
name = "codesign_sign_for_distribution"
path = "examples/rust/codesign/sign_for_distribution.rs"

# Opt-in test groups: tests needing an environment `cargo test` cannot assume
# are ignored unless their group is set, e.g.
# RUSTFLAGS='--cfg signers_test="keychain"' cargo test
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(signers_test, values("keychain", "macos27", "network"))'] }
