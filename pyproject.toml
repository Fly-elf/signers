[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "signers"
dynamic = ["version"]
description = "Typed Python API over code signing tools, starting with macOS codesign"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
keywords = ["codesign", "code-signing", "macos", "signing", "apple"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Fly-elf/signers"
Documentation = "https://github.com/Fly-elf/signers#readme"
Changelog = "https://github.com/Fly-elf/signers/blob/main/CHANGELOG.md"
Issues = "https://github.com/Fly-elf/signers/issues"

[tool.maturin]
manifest-path = "python/Cargo.toml"
python-source = "python"
module-name = "signers._native"
features = ["pyo3/extension-module"]
strip = true

[dependency-groups]
dev = ["maturin>=1.15,<2", "pytest", "pyright"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "python/Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "python/src/**/*.rs" },
]

[tool.pyright]
include = ["python/signers", "python/tests", "examples/python"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
