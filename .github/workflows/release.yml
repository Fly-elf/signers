name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 .github/scripts/release_check.py --tag "$TAG"
        env:
          TAG: ${{ github.ref_name }}

  tests:
    needs: preflight
    uses: ./.github/workflows/tests.yml
    with:
      macos: "27"
      network-required: true

  python:
    needs: preflight
    uses: ./.github/workflows/python.yml
    with:
      macos: "27"

  advisories:
    needs: preflight
    uses: ./.github/workflows/advisories.yml

  wheels:
    needs: preflight
    strategy:
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv sync --only-group dev
      - run: uv run --no-sync maturin build --release --locked --out dist
      - name: Check the wheel tags
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          wheel=$(ls dist/*.whl)
          case "$wheel" in
            dist/signers-*-abi3-*_"$ARCH".whl) echo "$wheel" ;;
            *) echo "unexpected wheel: $wheel"; exit 1 ;;
          esac
      - run: uv venv --python 3.11 "$RUNNER_TEMP/venv" && uv pip install --python "$RUNNER_TEMP/venv" dist/*.whl
      - working-directory: ${{ runner.temp }}
        run: venv/bin/python "$GITHUB_WORKSPACE/.github/scripts/smoke.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: preflight
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv sync --only-group dev
      - run: uv run --no-sync maturin sdist --out dist
      - run: uv venv --python 3.11 "$RUNNER_TEMP/venv" && uv pip install --python "$RUNNER_TEMP/venv" dist/*.tar.gz
      - working-directory: ${{ runner.temp }}
        run: venv/bin/python "$GITHUB_WORKSPACE/.github/scripts/smoke.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # The publish job runs on Linux, where the crate can't build, so it publishes
  # with --no-verify and this job verifies the package on macOS instead.
  package:
    needs: preflight
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - run: cargo publish --dry-run --locked -p signers

  # Each step skips what is already published, so re-running a failed job
  # completes a partial release.
  publish:
    needs: [tests, python, advisories, wheels, sdist, package]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
      # Crate creation can't use trusted publishing: the first release needs a token.
      HAS_BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Check crates.io
        id: crates
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "signers release workflow (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/signers/${TAG#v}")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io answered $status"; exit 1 ;;
          esac
      - id: crates-auth
        if: steps.crates.outputs.published == 'false' && env.HAS_BOOTSTRAP_TOKEN == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        if: steps.crates.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
        run: cargo publish --locked -p signers --no-verify

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/release_check.py --tag "$TAG" --notes-out "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
